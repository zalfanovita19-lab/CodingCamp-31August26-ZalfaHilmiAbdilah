<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <span class="app-title">Life Dashboard</span>
      <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
        🌙
      </button>
    </header>

    <!-- ===== MAIN DASHBOARD GRID ===== -->
    <main class="dashboard-grid">

      <!-- ── GREETING WIDGET ── -->
      <section id="widget-greeting" class="card" aria-label="Greeting">
        <h2 id="greeting-text">Good Morning</h2>
        <p id="date-text" class="date-text"></p>
        <p id="clock-text" class="clock-text"></p>
        <div class="name-row">
          <label for="name-input" class="sr-only">Your name</label>
          <input
            type="text"
            id="name-input"
            class="input"
            placeholder="Your name"
            aria-label="Enter your name"
            maxlength="50"
          />
          <button id="name-save" class="btn btn-primary">Save</button>
        </div>
      </section>

      <!-- ── FOCUS TIMER WIDGET ── -->
      <section id="widget-timer" class="card" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display" aria-live="polite" aria-label="Timer">25:00</div>
        <div class="timer-buttons">
          <button id="btn-start" class="btn btn-primary" aria-label="Start timer">Start</button>
          <button id="btn-stop"  class="btn btn-secondary" aria-label="Stop timer">Stop</button>
          <button id="btn-reset" class="btn btn-secondary" aria-label="Reset timer">Reset</button>
        </div>
        <p id="timer-status" class="timer-status">Ready</p>
        <div
          id="timer-notification"
          class="notification hidden"
          role="alert"
          aria-live="assertive"
        >
          🎉 Focus session complete!
        </div>
      </section>

      <!-- ── TO-DO LIST WIDGET ── -->
      <section id="widget-todo" class="card" aria-label="To-Do List">
        <h2>To-Do List</h2>
        <div class="todo-input-row">
          <label for="task-input" class="sr-only">New task</label>
          <input
            type="text"
            id="task-input"
            class="input"
            placeholder="Add a new task…"
            aria-label="New task text"
            maxlength="200"
          />
          <button id="btn-add-task" class="btn btn-primary" aria-label="Add task">Add</button>
        </div>
        <p
          id="todo-warning"
          class="warning-text hidden"
          role="alert"
          aria-live="assertive"
        ></p>
        <ul id="task-list" class="task-list" aria-label="Task list"></ul>
      </section>

      <!-- ── QUICK LINKS WIDGET ── -->
      <section id="widget-links" class="card" aria-label="Quick Links">
        <h2>Quick Links</h2>
        <div class="links-form">
          <label for="link-label-input" class="sr-only">Link label</label>
          <input
            type="text"
            id="link-label-input"
            class="input"
            placeholder="Label"
            aria-label="Quick link label"
            maxlength="50"
          />
          <label for="link-url-input" class="sr-only">Link URL</label>
          <input
            type="text"
            id="link-url-input"
            class="input"
            placeholder="https://example.com"
            aria-label="Quick link URL"
            maxlength="500"
          />
          <button id="btn-add-link" class="btn btn-primary" aria-label="Add quick link">Add Link</button>
        </div>
        <p
          id="links-error"
          class="warning-text hidden"
          role="alert"
          aria-live="assertive"
        ></p>
        <div id="links-container" class="links-container" aria-label="Quick links list"></div>
      </section>

    </main>

    <script src="js/script.js"></script>
  </body>
</html>
